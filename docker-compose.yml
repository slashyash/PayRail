# PayRail local database (PostgreSQL 16).
#   cp .env.example .env          # then edit the passwords
#   docker compose up -d db       # first start on an empty volume builds the schema
#   docker compose ps             # wait for "healthy"
# Tests:  docker compose exec -T db bash /payrail/db/tests/run_sql_tests.sh
# Reset (DESTRUCTIVE, dev only):  docker compose exec -T db bash /payrail/db/reset_dev.sh --yes payrail
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-payrail}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # psql/libpq defaults for `docker compose exec db ...` (local socket inside the container)
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-payrail}
      TZ: Asia/Kolkata
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - payrail_pgdata:/var/lib/postgresql/data
      - ./db:/payrail/db:ro
      # Runs ONLY when the data volume is empty (first start). Non-destructive.
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-payrail.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT 1 FROM pg_namespace WHERE nspname = 'payrail'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  payrail_pgdata:
